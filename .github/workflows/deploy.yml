name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install test tooling
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run regression and production-safety tests
        run: npm test
      - name: Verify isolated static deployment
        run: npm run test:build
