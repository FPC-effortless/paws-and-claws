<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Member Portal — Paws &amp; Claws</title>
  <meta name="description" content="Manage your pet profiles, appointments and member messages.">
  <link rel="icon" href="assets/brand/favicon.ico" sizes="any">
  <link rel="icon" href="assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/brand/favicon-180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=20261009-store5">
  <link rel="stylesheet" href="assets/css/pages.css?v=20261009-store5">
  <link rel="stylesheet" href="assets/css/platform.css?v=20261009-store5">
</head>
<body>
  <header class="site-header"></header>

  <main id="acctMain">
    <!-- gate (sign in / sign up) -->
    <section class="admin-gate" id="acctGate" style="display:none">
      <div class="gate-card">
        <div class="gate-tabs" role="tablist" aria-label="Account access">
          <button type="button" class="gate-tab active" data-gate="signIn" role="tab" aria-selected="true">Sign in</button>
          <button type="button" class="gate-tab" data-gate="signUp" role="tab" aria-selected="false">Create account</button>
        </div>

        <form id="signInForm" class="gate-form" novalidate>
          <div class="field">
            <label for="siEmail">Email</label>
            <input class="input" id="siEmail" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="field">
            <label for="siPw">Password</label>
            <input class="input" id="siPw" type="password" autocomplete="current-password" placeholder="At least 8 characters" required>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Sign in</button>
          <p class="gate-hint">New here? Create an account — it takes about a minute.</p>
        </form>

        <form id="signUpForm" class="gate-form" style="display:none" novalidate>
          <div class="field">
            <label for="suName">Full name</label>
            <input class="input" id="suName" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="suEmail">Email</label>
            <input class="input" id="suEmail" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="suPw">Password</label>
            <input class="input" id="suPw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required>
          </div>
          <div class="field">
            <label for="suPhone">Phone</label>
            <input class="input" id="suPhone" type="tel" autocomplete="tel">
          </div>
          <div class="field">
            <label for="suPet">Your pet's name <span style="font-weight:500;color:var(--ink-soft)">(optional)</span></label>
            <input class="input" id="suPet" type="text">
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Create my account</button>
        </form>
      </div>
    </section>

    <!-- dashboard -->
    <section id="acctApp" style="display:none">
      <div class="wrap acct-head">
        <div>
          <span class="eyebrow">Member portal</span>
          <h1 id="acctHello">Welcome back</h1>
          <p class="lead" id="acctSub"></p>
        </div>
        <button type="button" class="btn btn-ghost" id="acctLogout">Sign out</button>
      </div>

      <div class="wrap acct-tabs" role="tablist" aria-label="Account sections">
        <button type="button" class="acct-tab active" data-tab="overview" role="tab" aria-selected="true">&#128204; Overview</button>
        <button type="button" class="acct-tab" data-tab="pets" role="tab" aria-selected="false">&#128021; My pets</button>
        <button type="button" class="acct-tab" data-tab="bookings" role="tab" aria-selected="false">&#128197; Appointments</button>
        <button type="button" class="acct-tab" data-tab="orders" role="tab" aria-selected="false">&#128722; Orders</button>
        <button type="button" class="acct-tab" data-tab="inbox" role="tab" aria-selected="false">&#128236; Inbox <span class="tab-badge" id="inboxBadge" hidden>0</span></button>
        <button type="button" class="acct-tab" data-tab="payment" role="tab" aria-selected="false">&#128179; Payment</button>
        <button type="button" class="acct-tab" data-tab="settings" role="tab" aria-selected="false">&#9881; Settings</button>
      </div>

      <div class="wrap acct-panels">
        <div class="acct-panel active" data-panel="overview" id="panelOverview"></div>
        <div class="acct-panel" data-panel="pets" id="panelPets"></div>
        <div class="acct-panel" data-panel="bookings" id="panelBookings"></div>
        <div class="acct-panel" data-panel="orders" id="panelOrders"></div>
        <div class="acct-panel" data-panel="inbox" id="panelInbox"></div>
        <div class="acct-panel" data-panel="payment" id="panelPayment"></div>
        <div class="acct-panel" data-panel="settings" id="panelSettings"></div>
      </div>
    </section>
  </main>

  <!-- pet editor modal -->
  <div class="modal-backdrop" id="petModal">
    <div class="modal modal-shell" role="dialog" aria-modal="true" aria-labelledby="petModalTitle">
      <button class="modal-close" data-close-modal="petModal" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--ocean)" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-pad">
        <h2 id="petModalTitle" style="font-size:1.5rem">Add a pet</h2>
        <form id="petForm" class="grid2" novalidate>
          <div class="field">
            <label for="pfName">Pet name</label>
            <input class="input" id="pfName" type="text" required>
          </div>
          <div class="field">
            <label for="pfSpecies">Species</label>
            <select class="input" id="pfSpecies"></select>
          </div>
          <div class="field">
            <label for="pfBreed">Breed</label>
            <input class="input" id="pfBreed" type="text">
          </div>
          <div class="field">
            <label for="pfDob">Date of birth</label>
            <input class="input" id="pfDob" type="date">
          </div>
          <div class="field">
            <label for="pfSex">Sex</label>
            <select class="input" id="pfSex"></select>
          </div>
          <div class="field">
            <label for="pfAltered">Spay / neuter status</label>
            <select class="input" id="pfAltered"></select>
          </div>
          <div class="field">
            <label for="pfWeight">Weight (kg)</label>
            <input class="input" id="pfWeight" type="number" min="0" step="0.1">
          </div>
          <div class="field">
            <label for="pfChip">Microchip</label>
            <input class="input" id="pfChip" type="text">
          </div>
          <div class="field" style="grid-column:1/-1">
            <label for="pfNotes">Care notes</label>
            <textarea class="input" id="pfNotes" rows="2" placeholder="Allergies, medications, quirks we should know about…"></textarea>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit" style="grid-column:1/-1">Save pet</button>
        </form>
      </div>
    </div>
  </div>

  <!-- vaccine upload modal -->
  <div class="modal-backdrop" id="vaxModal">
    <div class="modal modal-shell" role="dialog" aria-modal="true" aria-labelledby="vaxTitle">
      <button class="modal-close" data-close-modal="vaxModal" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--ocean)" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <div class="modal-pad">
        <h2 id="vaxTitle" style="font-size:1.5rem">Upload a vaccine record</h2>
        <p style="color:var(--ink-soft);font-size:.9rem" id="vaxPetName"></p>
        <form id="vaxForm" novalidate>
          <div class="field">
            <label for="vfName">Vaccine</label>
            <select class="input" id="vfName"></select>
          </div>
          <div class="field">
            <label for="vfDate">Administration date</label>
            <input class="input" id="vfDate" type="date" required>
          </div>
          <div class="field">
            <label for="vfLot">Lot number <span style="font-weight:500;color:var(--ink-soft)">(optional)</span></label>
            <input class="input" id="vfLot" type="text">
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Submit for review</button>
          <p class="cart-note">Records are checked by our front desk before they're approved.</p>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/js/data.js?v=20261009-store5"></script>
  <script src="assets/js/app.js?v=20261009-store5"></script>
  <script src="assets/js/nav.js?v=20261009-store5"></script>
  <script src="assets/js/convexClient.js?v=20261009-store5"></script>
  <!-- Clerk is the identity provider. The publishable key lives in
       assets/js/clerk.js — one place for the whole site. Without a
       key the site runs in DEMO MODE. -->
  <script src="assets/js/clerk.js?v=20261009-store5"></script>
  <script src="assets/js/account.js?v=20261009-store5"></script>
</body>
</html>
